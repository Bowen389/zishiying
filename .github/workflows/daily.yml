name: 四象限首板扫描
on:
  schedule:
    - cron: '6,36 9 * * 1-5'
    - cron: '31,41 1 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '盘后补扫日期 YYYY-MM-DD'
        type: string
      opening:
        description: '筛选当天开盘缺口'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/daily.yml']
permissions:
  contents: write
concurrency:
  group: zishiying-main
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'exchange-calendars>=4.11,<5' akshare
      - uses: actions/cache/restore@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Scan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_OPENING: ${{ inputs.opening }}
        run: |
          if [ "$SCHEDULE" = '31,41 1 * * 1-5' ] || [ "$INPUT_OPENING" = 'true' ]; then
            python scan.py --opening
          elif [ -n "$INPUT_DATE" ]; then
            python scan.py --date "$INPUT_DATE"
          elif [ "${{ github.event_name }}" = 'push' ]; then
            day=$(python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; from exchange_calendars import get_calendar; now=datetime.now(ZoneInfo("Asia/Shanghai")); cutoff=now.date()-timedelta(days=int(now.hour < 17)); print(get_calendar("XSHG").date_to_session(cutoff.isoformat(), direction="previous").date())')
            python scan.py --date "$day"
          else
            python scan.py
          fi
      - uses: actions/cache/save@v4
        if: success() && hashFiles('data/prices/*.csv') != ''
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
      - name: Publish reports
        run: |
          for path in reports state; do
            if [ -d "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish four-quadrant signals'
          git pull --rebase origin main
          git push origin HEAD:main
